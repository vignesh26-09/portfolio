<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#19132e" />
      <stop offset="60%" stop-color="#090714" />
      <stop offset="100%" stop-color="#030208" />
    </radialGradient>
    <linearGradient id="purpleCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ff8a50" />
    </linearGradient>
    <pattern id="grid2" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="500" height="500" fill="url(#bg2)" />
  <rect width="500" height="500" fill="url(#grid2)" />
  
  <!-- Outer border & corner accents -->
  <rect x="15" y="15" width="470" height="470" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <path d="M 15 35 L 35 15 M 485 35 L 465 15 M 15 465 L 35 485 M 485 465 L 465 485" stroke="#c084fc" stroke-width="2" />
  
  <!-- Top badge bar -->
  <rect x="35" y="35" width="430" height="40" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="55" cy="55" r="4" fill="#c084fc" />
  <text x="68" y="59" fill="#c084fc" font-family="'Chakra Petch', monospace" font-size="12" font-weight="600" letter-spacing="2">PROJECT // 02</text>
  <text x="445" y="59" text-anchor="end" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">BUILT 2026</text>

  <!-- Central Graphic: Sentiment Radar & Analytics Pipeline -->
  <g transform="translate(0, 30)">
    <!-- Radar webs -->
    <polygon points="250,110 310,150 310,210 250,250 190,210 190,150" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <polygon points="250,135 285,160 285,195 250,225 215,195 215,160" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="3 3" />
    <!-- Sentiment shape -->
    <polygon points="250,120 300,165 275,215 235,230 205,185 220,140" fill="rgba(192,132,252,0.18)" stroke="url(#purpleCoral)" stroke-width="2.5" />
    
    <!-- Radar dots -->
    <circle cx="250" cy="120" r="3.5" fill="#ff8a50" />
    <circle cx="300" cy="165" r="3.5" fill="#c084fc" />
    <circle cx="275" cy="215" r="3.5" fill="#38bdf8" />
    <circle cx="235" cy="230" r="3.5" fill="#ff8a50" />
    <circle cx="205" cy="185" r="3.5" fill="#34d399" />
    <circle cx="220" cy="140" r="3.5" fill="#c084fc" />

    <!-- Metric tags -->
    <text x="250" y="100" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">SENTIMENT</text>
    <text x="325" y="155" fill="#94a3b8" font-family="monospace" font-size="9">ASPECT</text>
    <text x="325" y="215" fill="#94a3b8" font-family="monospace" font-size="9">COMPETITOR</text>
    <text x="250" y="265" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="9">FORECAST</text>
    <text x="175" y="215" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="9">VOLUME</text>
    <text x="175" y="155" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="9">TRUST</text>
  </g>

  <!-- Typography & Tags -->
  <text x="45" y="330" fill="#ffffff" font-family="'Chakra Petch', sans-serif" font-size="34" font-weight="700" letter-spacing="-1">TRIP</text>
  <text x="45" y="358" fill="#c084fc" font-family="'Chakra Petch', monospace" font-size="12" font-weight="600" letter-spacing="2">TOURISM REPUTATION INTELLIGENCE</text>
  
  <text x="45" y="390" fill="#94a3b8" font-family="sans-serif" font-size="13">AI platform turning thousands of travel &amp; hotel reviews into</text>
  <text x="45" y="410" fill="#94a3b8" font-family="sans-serif" font-size="13">sentiment analytics, competitor intel, and forecasting models.</text>

  <!-- Tech tags -->
  <g transform="translate(45, 435)">
    <rect x="0" y="0" width="65" height="24" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="32" y="16" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">Python</text>
    
    <rect x="73" y="0" width="65" height="24" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="105" y="16" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">FastAPI</text>

    <rect x="146" y="0" width="55" height="24" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="173" y="16" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">React</text>

    <rect x="209" y="0" width="95" height="24" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="256" y="16" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">Spring Boot</text>
  </g>
</svg>
