<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#211d10" />
      <stop offset="60%" stop-color="#0e0c06" />
      <stop offset="100%" stop-color="#040302" />
    </radialGradient>
    <linearGradient id="amberCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ff8a50" />
    </linearGradient>
    <pattern id="grid5" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="500" height="500" fill="url(#bg5)" />
  <rect width="500" height="500" fill="url(#grid5)" />
  
  <rect x="15" y="15" width="470" height="470" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <path d="M 15 35 L 35 15 M 485 35 L 465 15 M 15 465 L 35 485 M 485 465 L 465 485" stroke="#f59e0b" stroke-width="2" />
  
  <rect x="35" y="35" width="430" height="40" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="55" cy="55" r="4" fill="#f59e0b" />
  <text x="68" y="59" fill="#f59e0b" font-family="'Chakra Petch', monospace" font-size="12" font-weight="600" letter-spacing="2">PROJECT // 05</text>
  <text x="445" y="59" text-anchor="end" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">STREAMING</text>

  <!-- Central Graphic: Telemetry Stream Dashboard -->
  <g transform="translate(45, 105)">
    <rect x="0" y="0" width="410" height="175" rx="8" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.1)" />
    
    <!-- Mini KPI cards -->
    <rect x="20" y="20" width="115" height="50" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="32" y="38" fill="#64748b" font-family="monospace" font-size="9">LATENCY</text>
    <text x="32" y="58" fill="#f59e0b" font-family="'Chakra Petch', monospace" font-size="16" font-weight="bold">14.2 ms</text>

    <rect x="145" y="20" width="115" height="50" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="157" y="38" fill="#64748b" font-family="monospace" font-size="9">UPTIME</text>
    <text x="157" y="58" fill="#10b981" font-family="'Chakra Petch', monospace" font-size="16" font-weight="bold">99.98%</text>

    <rect x="270" y="20" width="120" height="50" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
    <text x="282" y="38" fill="#64748b" font-family="monospace" font-size="9">THROUGHPUT</text>
    <text x="282" y="58" fill="#ff9a7b" font-family="'Chakra Petch', monospace" font-size="16" font-weight="bold">8.4k evt/s</text>

    <!-- Wave stream -->
    <path d="M 20 120 Q 50 85, 80 120 T 140 120 T 200 120 T 260 120 T 320 120 T 390 120" fill="none" stroke="url(#amberCoral)" stroke-width="2.5" />
    <line x1="20" y1="150" x2="390" y2="150" stroke="rgba(255,255,255,0.06)" />
    <text x="20" y="163" fill="#64748b" font-family="monospace" font-size="9">ws://telemetry.vignesh.dev/live [SYNCED]</text>
  </g>

  <text x="45" y="330" fill="#ffffff" font-family="'Chakra Petch', sans-serif" font-size="34" font-weight="700" letter-spacing="-1">PulseMetrics</text>
  <text x="45" y="358" fill="#f59e0b" font-family="'Chakra Petch', monospace" font-size="12" font-weight="600" letter-spacing="2">REAL-TIME STREAMING TELEMETRY</text>
  
  <text x="45" y="390" fill="#94a3b8" font-family="sans-serif" font-size="13">High-throughput WebSocket telemetry stream monitor with</text>
  <text x="45" y="410" fill="#94a3b8" font-family="sans-serif" font-size="13">latency profiling, Redis Pub/Sub, and live event pipelines.</text>

  <g transform="translate(45, 435)">
    <rect x="0" y="0" width="85" height="24" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="42" y="16" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">WebSockets</text>
    
    <rect x="93" y="0" width="55" height="24" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="120" y="16" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">Redis</text>

    <rect x="156" y="0" width="65" height="24" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="188" y="16" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="11">Node.js</text>
  </g>
</svg>
