  <rect x="15" y="15" width="470" height="470" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <path d="M 15 35 L 35 15 M 485 35 L 465 15 M 15 465 L 35 485 M 485 465 L 465 485" stroke="#fb7185" stroke-width="2" />
  
  <rect x="35" y="35" width="430" height="40" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
  <circle cx="55" cy="55" r="4" fill="#fb7185" />
  <text x="68" y="59" fill="#fb7185" font-family="'Chakra Petch', monospace" font-size="12" font-weight="600" letter-spacing="2">PROJECT // 03</text>
  <text x="445" y="59" text-anchor="end" fill="rgba(255,255,255,0.4)" font-family="monospace" font-size="11">DEVELOPER TOOL</text>

