<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1f1124" />
      <stop offset="60%" stop-color="#0c070e" />
      <stop offset="100%" stop-color="#040205" />
    </radialGradient>
    <linearGradient id="roseCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#ff8a50" />
    </linearGradient>
    <pattern id="grid3" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="500" height="500" fill="url(#bg3)" />
