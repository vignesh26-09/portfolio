    <circle cx="40" cy="14" r="4" fill="#10b981" opacity="0.8" />
    <text x="60" y="18" fill="#94a3b8" font-family="monospace" font-size="10">regex_workbench.tsx</text>

    <!-- Code lines -->
    <text x="20" y="58" fill="#64748b" font-family="monospace" font-size="11">const pattern = <tspan fill="#ff9a7b">/\b[A-Z0-9._%+-]+@domain\b/gi</tspan>;</text>
    <rect x="20" y="75" width="370" height="32" rx="4" fill="rgba(255,138,80,0.1)" stroke="rgba(255,138,80,0.3)" />
    <text x="32" y="96" fill="#f8fafc" font-family="monospace" font-size="11">> Match: <tspan fill="#34d399">hello@vignesh.dev</tspan> [200 OK]</text>
    
    <text x="20" y="132" fill="#64748b" font-family="monospace" font-size="11">latency: 0.12ms · memory: 1.4MB · buffer: sync</text>
    <line x1="20" y1="148" x2="390" y2="148" stroke="rgba(255,255,255,0.06)" />
    <text x="20" y="163" fill="#fb7185" font-family="monospace" font-size="10">● 4 PASSING TESTS</text>
  </g>

  <text x="45" y="330" fill="#ffffff" font-family="'Chakra Petch', sans-serif" font-size="34" font-weight="700" letter-spacing="-1">DevForge</text>
  <text x="45" y="358" fill="#fb7185" font-family="'Chakra Petch', monospace" font-size="12" font-weight="600" letter-spacing="2">DEVELOPER WORKBENCH &amp; REGEX STUDIO</text>
  
  <text x="45" y="390" fill="#94a3b8" font-family="sans-serif" font-size="13">High-speed developer tooling suite with real-time expression</text>
